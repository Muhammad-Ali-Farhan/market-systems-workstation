[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-data-execution-engine"
version = "1.0.0"
description = "High-performance C++20/Python market-data infrastructure with sequence-correct L2 reconstruction, deterministic replay, execution simulation, and leakage-aware research"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12,<3.13"
authors = [{name = "Muhammad Ali Farhan"}]
dependencies = [
  "numpy==2.5.1",
  "certifi==2026.6.17",
  "websocket-client==1.8.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: C++",
  "Programming Language :: C++ :: 20",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Office/Business :: Financial",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

# Console entry points remain short for users even though the source tree is
# organized by engineering responsibility rather than as a flat module list.
[project.scripts]
market-analytics = "market_engine.cli.analytics:main"
market-benchmark = "market_engine.cli.top_of_book_benchmark:main"
market-capture = "market_engine.cli.capture_top_of_book:main"
market-recording-info = "market_engine.cli.top_of_book_recording_info:main"
market-train-alpha = "market_engine.cli.train_alpha:main"
market-alpha-monitor = "market_engine.cli.alpha_monitor:main"
market-verify-replay = "market_engine.cli.verify_top_of_book_replay:main"
market-workstation = "market_engine.cli.workstation:main"
market-l2-capture = "market_engine.market_data.l2_capture:main"
market-l2-verify = "market_engine.cli.verify_l2_replay:main"
market-l2-info = "market_engine.cli.l2_recording_info:main"
market-l2-benchmark = "market_engine.cli.l2_benchmark:main"
market-l2-research = "market_engine.research.l2_pipeline:main"
market-l2-simulate = "market_engine.execution.simulator:main"
market-l2-execution-sensitivity = "market_engine.execution.sensitivity:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["market_engine*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests/python"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["build", "build-native", "build-app", "dist", "vcpkg_installed"]

[tool.ruff.lint]
# Keep the policy explicit so local development and CI do not inherit changing
# version-dependent defaults from Ruff releases.
select = ["E4", "E7", "E9", "F"]
